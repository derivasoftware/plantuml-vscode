verification:
  id: VER-00002-2
  req_id: REQ-00002-1
  title: Server-option and activation tests cover resolution, the safe default and startup degradation
  description: >
    The pure tests cover command resolution and the document selector;
    the activation tests drive activate/deactivate against a stubbed
    vscode and language client: the client starts with the configured
    path, lsp.enabled=false skips it, a server that cannot start
    degrades to a warning naming the install command, and deactivate
    stops a running client. Revision 2 adds the activation cases.
  method: test
  test_ids:
    - "tests/integration/serverOptions.test.ts::falls back to the default command"
    - "tests/integration/serverOptions.test.ts::honours a configured path"
    - "tests/integration/serverOptions.test.ts::targets file-scheme plantuml documents"
    - "tests/integration/extensionActivation.test.ts::skips the language client when lsp.enabled is false"
    - "tests/integration/extensionActivation.test.ts::starts the client with the configured server path"
    - "tests/integration/extensionActivation.test.ts::degrades to a warning when the server cannot start"
    - "tests/integration/extensionActivation.test.ts::stops the running client on deactivate"
  status: APPROVED

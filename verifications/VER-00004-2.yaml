verification:
  id: VER-00004-2
  req_id: REQ-00004-1
  title: Bundle tests prove the shipped webview
  description: >
    The bundle tests build the webview exactly as it ships and prove the
    parser, the engine and no-eval are in it; under the asynchronous
    renderer (plantuml-render 0.25) the drawing follows the editor's
    theme live and only the latest render writes the stage, and since
    PUML-107 the bundled engine is the only one, with no node builtins.
    The host's controller tests moved to VER-00008-1 with the host's own
    requirement (PUML-103).
  method: test
  test_ids:
    - "tests/integration/preview.test.ts::bundles the wasm parser and the render engine"
    - "tests/integration/preview.test.ts::never reaches for eval \u2014 CSP allows wasm only"
    - "tests/integration/preview.test.ts::themes the drawing from the editor's theme, live"
    - "tests/integration/preview.test.ts::lets only the latest render write the stage"
    - "tests/integration/preview.test.ts::renders with the bundled engine only, no jar path ships"
    - "tests/integration/preview.test.ts::never pulls node builtins into the webview"
  status: APPROVED

verification:
  id: VER-00007-2
  req_id: REQ-00007-1
  title: Controller tests cover the per-panel engine override, the jar debounce and its cancellation
  description: >
    The bundle and manifest tests pin the selector wiring and settings.
    Revision 2 adds behaviour: switching to plantuml.jar schedules one
    debounced render, a newer request aborts the in-flight child, and
    disposing the panel clears the override so the next panel follows
    the setting again.
  method: test
  test_ids:
    - "tests/integration/preview.test.ts::wires the engine selector and the jar result message"
    - "tests/integration/preview.test.ts::falls back to the native render when the jar fails"
    - "tests/integration/preview.test.ts::never pulls node builtins into the webview"
    - "tests/integration/manifest.test.ts::exposes the engine choice with native default"
    - "tests/integration/manifest.test.ts::exposes jar and java paths, jar unbundled by default"
    - "tests/integration/clientPreview.test.ts::switching to plantuml.jar schedules one debounced render"
    - "tests/integration/clientPreview.test.ts::a newer request aborts the in-flight jar render"
    - "tests/integration/clientPreview.test.ts::disposing the panel clears the engine override"
  status: APPROVED

verification:
  id: VER-00004-2
  req_id: REQ-00004-1
  title: Bundle tests prove the shipped webview; controller tests prove the source protocol and CSP
  description: >
    The bundle tests prove parser, engine and no-eval ship in the
    webview exactly as built. Revision 2 adds the controller side: the
    panel serves nonce-locked CSP html carrying both wasm uris, answers
    the webview's ready with the include-expanded source, and re-posts
    on active-document edits and render-configuration changes.
  method: test
  test_ids:
    - "tests/integration/preview.test.ts::bundles the wasm parser and the render engine"
    - "tests/integration/preview.test.ts::never reaches for eval \u2014 CSP allows wasm only"
    - "tests/integration/clientPreview.test.ts::asks for a .puml file when none is active"
    - "tests/integration/clientPreview.test.ts::creates one panel and reveals it on the second invocation"
    - "tests/integration/clientPreview.test.ts::serves nonce-locked CSP html carrying both wasm uris"
    - "tests/integration/clientPreview.test.ts::answers the webview's ready with the expanded source"
    - "tests/integration/clientPreview.test.ts::re-posts on active-document edits and ignores other documents"
    - "tests/integration/clientPreview.test.ts::re-posts when the render configuration changes"
  status: APPROVED

# CI — plantuml-vscode. Node-only: compile + vitest on MR/main; the
# render dependency installs from the public GitHub mirror; release
# tags package the .vsix and push it to the generic package registry.

include:
  - project: deriva/infra/ci-templates
    ref: main
    file:
      - /templates/base.yml
      - /templates/node.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# The manifest points the render dependency at the public GitHub mirror;
# the rewrite resolves it against this GitLab's own project (same repo,
# local network, job-token auth).
.git-mirror-local: &git-mirror-local
  - export GIT_CONFIG_GLOBAL="$CI_PROJECT_DIR/.gitconfig-ci"
  - git config --file "$GIT_CONFIG_GLOBAL"
    url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/deriva/plantuml/".insteadOf
    "https://github.com/derivasoftware/"

test:
  stage: test
  extends: [.node-base, .on-mr-and-main]
  script:
    - *git-mirror-local
    - npm ci
    - mkdir -p test-results
    - npm run test:ci

package-vsix:
  stage: deploy
  extends: [.node-base]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - *git-mirror-local
    - npm ci
    - npm run compile
    - npx vsce package --allow-missing-repository --baseContentUrl "${CI_PROJECT_URL}/-/raw/main/" --baseImagesUrl "${CI_PROJECT_URL}/-/raw/main/" -o plantuml-vscode-${CI_COMMIT_TAG}.vsix
    - >
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file plantuml-vscode-${CI_COMMIT_TAG}.vsix
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/plantuml-vscode/${CI_COMMIT_TAG}/plantuml-vscode-${CI_COMMIT_TAG}.vsix"
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 30 days
